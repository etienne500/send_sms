name: camsms_campaign_manager
description: Gestionnaire local de campagnes SMS multi-SIM pour Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  csv: ^6.0.0
  excel: ^4.0.6
  intl: ^0.19.0
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
